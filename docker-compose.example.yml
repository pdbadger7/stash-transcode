version: '3.8'

services:
  # Stash (example - adjust for your setup)
  # stash:
  #   image: stashapp/stash:latest
  #   ports:
  #     - "9999:9999"
  #   volumes:
  #     - stash_data:/root/.stash
  #     - /mnt/nas/media:/data
  #   environment:
  #     - STASH_PORT=9999

  # External transcoding agent
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /mnt/nas/media:/mnt/nas/media:ro
      - agent_cache:/cache/hls
    environment:
      STASH_GRAPHQL_URL: http://stash:9999/graphql
      STASH_API_KEY: ${STASH_API_KEY:-your-api-key-here}
      STASH_INSECURE_TLS: "false"
      PATH_MAPPINGS: /data/=/mnt/nas/media/
      MEDIA_ROOT: /mnt/nas/media
      AGENT_BASE_URL: https://video.home
      HLS_CACHE_DIR: /cache/hls
      FFMPEG_PATH: /usr/bin/ffmpeg
      HWACCEL: auto
      HWACCEL_DEVICE: /dev/dri/renderD128
      REMUX_HLS_VIDEO_CODECS: h264,hevc
      REMUX_HLS_READ_RATE: 0
      REMUX_HLS_START_OFFSET_SECONDS: 0.15
      REMUX_HLS_READY_TIMEOUT_MS: 30000
      PORT: 8080
      AGENT_SHARED_TOKEN: ${AGENT_SHARED_TOKEN:-}
      CORS_ALLOWED_ORIGINS: "*"
    # Uncomment for VAAPI/QSV hardware acceleration:
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
    # Uncomment if using local Stash:
    # depends_on:
    #   - stash

volumes:
  # stash_data:
  agent_cache:
