apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: stash
data:
  STASH_GRAPHQL_URL: "https://stash.home/graphql"
  STASH_INSECURE_TLS: "false"
  PATH_MAPPINGS: "/data/=/mnt/nas/media/"
  MEDIA_ROOT: "/mnt/nas/media"
  AGENT_BASE_URL: "https://video.home"
  HLS_CACHE_DIR: "/cache/hls"
  FFMPEG_PATH: "/usr/bin/ffmpeg"
  HWACCEL: "auto"
  HLS_SEGMENT_DURATION: "4"
  HLS_STARTUP_SEGMENT_DURATION: "1"
  HLS_VARIANT_WAIT_MS: "30000"
  HLS_VARIANT_POLL_MS: "250"
  PORT: "8080"
  CORS_ALLOWED_ORIGINS: "*"
