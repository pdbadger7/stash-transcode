apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent
  namespace: stash
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - video.home
    secretName: agent-tls
  rules:
  - host: video.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agent
            port:
              number: 80
