name: External Transcode Player
description: >
  Redirects scene playback to an external transcoding service while
  maintaining Stash as the UI and catalog.
version: 0.1.9

settings:
  externalTranscodeBaseUrl:
    displayName: External Transcoder Base URL
    description: Base URL of the external transcoding agent, including scheme (for example, https://video.home)
    type: STRING

  playbackPriority:
    displayName: Playback Priority
    description: Comma-separated playback priority using remux-hls, hls, direct, and stash
    type: STRING

  directPathPattern:
    displayName: Direct Playback Path Pattern
    description: URL path pattern for direct playback; use {id} for the scene ID
    type: STRING

  hlsPathPattern:
    displayName: Transcoded HLS Path Pattern
    description: URL path pattern for the HLS master manifest; use {id} for the scene ID
    type: STRING

  remuxHlsPathPattern:
    displayName: Remux HLS Path Pattern
    description: URL path pattern for copy-only remux HLS; use {id} for the scene ID
    type: STRING

  fallbackToStashPlayer:
    displayName: Fallback to Stash Player
    description: >
      Fall back to the original Stash player if the external agent is unavailable or errors
    type: BOOLEAN

  sharedToken:
    displayName: Shared Authentication Token
    description: >
      Optional token to include in requests to the external agent. Leave empty for no authentication.
    type: STRING

  externalPlayerUrlTemplate:
    displayName: External Player URL Template
    description: >
      Optional URL template for external-player buttons. Use {encodedURL} for the URL-encoded stream URL, for example iina://weblink?url={encodedURL}
    type: STRING

  debug:
    displayName: Debug Logging
    description: Enable detailed console logging for troubleshooting
    type: BOOLEAN

ui:
  csp:
    connect-src:
      - "https:"
      - "http:"
  javascript:
    - externalTranscodePlayer.js
